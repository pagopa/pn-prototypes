openapi: "3.0.0"
info:
  version: 1.0.0
  title: Template example
  license:
    name: MIT
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /aar/radd:
    post:
      summary: List all pets
      operationId: aarRad
      tags:
        - template
      parameters:
        - name: language
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
              schema:
                $ref: "#/components/schemas/Pet"
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:    
              schema:
                type: "string"
                format: "byte"
  /email/cortesia:
    post:
      summary: Template per avviso di cortesia per email
      operationId: courtesyEmail
      tags:
        - template
      parameters:
        - name: language
          in: query
          description: Lingua del template
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
              schema:
                $ref: "#/components/schemas/Pet"
      responses:
        '200':
          description: Template per email
          content:
            application/json:    
              schema:
                type: "string"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
